# Downloads a Linux build of Blender into ./blender (cached) and installs its runtime libraries.
name: Set up Blender
description: Download Blender into ./blender and install the libraries it needs to run headless

inputs:
  series:
    description: Release series, e.g. "4.2" (the download folder)
    required: true
  version:
    description: Exact version, e.g. "4.2.0"
    required: true

runs:
  using: composite
  steps:
    - name: Cache Blender
      id: cache-blender
      uses: actions/cache@v4
      with:
        path: blender
        key: blender-${{ inputs.version }}-linux-x64

    - name: Download Blender
      if: steps.cache-blender.outputs.cache-hit != 'true'
      shell: bash
      env:
        BLENDER_SERIES: ${{ inputs.series }}
        BLENDER_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ
        mv "blender-${BLENDER_VERSION}-linux-x64" blender

    - name: Install Blender runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
