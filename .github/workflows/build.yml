# Tests, validates and builds the extension zip on every push and pull request.
# Pushing a tag "vX.Y.Z" (matching the manifest version) also publishes a GitHub Release with the zip.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Oldest supported Blender (blender_version_min in the manifest).
  BLENDER_SERIES: "4.2"
  BLENDER_VERSION: "4.2.0"

jobs:
  test:
    name: Test (Blender ${{ matrix.blender.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Blender and the current release. The test characters in tests/in
        # are not redistributable, so CI runs on generated Rigify characters.
        blender:
          - { series: "4.2", version: "4.2.0" }
          - { series: "5.2", version: "5.2.1" }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-blender
        with:
          series: ${{ matrix.blender.series }}
          version: ${{ matrix.blender.version }}

      - name: Run tests on generated Rigify characters
        run: bash tests/run_rigify_variants.sh ./blender/blender tests/out/rigify

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs-${{ matrix.blender.version }}
          path: tests/out/rigify/*.log

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-blender
        with:
          series: ${{ env.BLENDER_SERIES }}
          version: ${{ env.BLENDER_VERSION }}

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(sed -n 's/^version = "\(.*\)"/\1/p' cascadeur_export/blender_manifest.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Validate extension
        run: ./blender/blender --factory-startup --command extension validate cascadeur_export

      - name: Build extension
        run: |
          mkdir -p dist
          ./blender/blender --factory-startup --command extension build --source-dir cascadeur_export --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: humanoid-export
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
