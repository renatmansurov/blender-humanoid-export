# Validates and builds the extension zip on every push and pull request.
# Pushing a tag "vX.Y.Z" (matching the manifest version) also publishes a GitHub Release with the zip.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Oldest supported Blender (blender_version_min in the manifest).
  BLENDER_SERIES: "4.2"
  BLENDER_VERSION: "4.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar -xJ
          mv "blender-${BLENDER_VERSION}-linux-x64" blender

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(sed -n 's/^version = "\(.*\)"/\1/p' cascadeur_export/blender_manifest.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Validate extension
        run: ./blender/blender --factory-startup --command extension validate cascadeur_export

      - name: Build extension
        run: |
          mkdir -p dist
          ./blender/blender --factory-startup --command extension build --source-dir cascadeur_export --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: cascadeur_export
          path: dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
